function assignJudge(projectId) {
    const db = getDB();
    const judgeId = document.getElementById("assignmentJudge")?.value;

    if (!judgeId) { showToast("Select a judge first.", "warning"); return; }

    const project = db.projects.find(p => p.id === projectId);
    const judge = db.judges.find(j => j.id === judgeId);
    if (!project || !judge) return;

    const count = db.assignments.filter(a => a.projectId === projectId).length;

    if (count >= MAX_PROJECT_JUDGES) {
        showToast(`A project can have a maximum of ${MAX_PROJECT_JUDGES} judges.`, "danger");
        return;
    }

    if (judge.category !== project.category) {
        showToast("Judge category does not match project category.", "danger");
        return;
    }

    if (judge.status !== "active") { showToast("This judge is not active.", "danger"); return; }

    if (db.conflicts.some(c => c.projectId === projectId && c.judgeId === judgeId && c.status === "active")) {
        showToast("This judge has a conflict with the project.", "danger");
        return;
    }

    if (db.assignments.some(a => a.projectId === projectId && a.judgeId === judgeId)) {
        showToast("Judge is already assigned.", "warning");
        return;
    }

    db.assignments.push({ id: uid("assignment"), projectId, judgeId, assignedAt: now() });

    saveDB(db);
    addAuditLog(currentUser(), "Judge assigned", `${judge.name} was assigned to ${project.projectCode}.`);
    showToast("Judge assigned.");
    openAssignmentModal(projectId);
}

function unassignJudge(projectId, judgeId) {
    const db = getDB();
    const project = db.projects.find(p => p.id === projectId);
    const judge = db.judges.find(j => j.id === judgeId);

    db.assignments = db.assignments.filter(a =>
        !(a.projectId === projectId && a.judgeId === judgeId));

    saveDB(db);
    addAuditLog(currentUser(), "Judge unassigned",
        `${judge?.name || "Judge"} was unassigned from ${project?.projectCode || "project"}.`);
    showToast("Judge unassigned.");
    openAssignmentModal(projectId);
}

    const idx = db.settings.disabledCategories.indexOf(category);

    if (idx >= 0) {
        db.settings.disabledCategories.splice(idx, 1);
        addAuditLog(currentUser(), "Category enabled", `Category "${category}" was enabled.`);
        showToast(`Category "${category}" enabled.`);
    } else {
        db.settings.disabledCategories.push(category);
        addAuditLog(currentUser(), "Category disabled", `Category "${category}" was disabled.`);
        showToast(`Category "${category}" disabled.`, "warning");
    }

    saveDB(db);
    renderApp();
}

            mark.projectId === projectId &&
            submitted
        );
    });

    if (!submittedMarks.length) {

    }

    const total = submittedMarks.reduce(
        (sum, mark) => {
            return sum + calculateMarkTotal(mark);
        },
        0
    );

    return total / submittedMarks.length;
}

function filterMarksTable() {

    const search =
        document.getElementById("marksSearch")
            ?.value
            .toLowerCase()
            .trim() || "";

    const category =
        document.getElementById("marksCatFilter")
            ?.value || "";

    const status =
        document.getElementById("marksStatusFilter")
            ?.value || "";

    const rows =
        document.querySelectorAll("#marksTable tbody tr");

    rows.forEach(row => {

        const rowSearch =
            row.dataset.search || "";

        const rowCategory =
            row.dataset.cat || "";

        const rowStatus =
            row.dataset.status || "";

        const matchesSearch =
            !search ||
            rowSearch.includes(search);

        const matchesCategory =
            !category ||
            rowCategory === category;

        const matchesStatus =
            !status ||
            rowStatus === status;

        row.style.display =
            matchesSearch &&
            matchesCategory &&
            matchesStatus
                ? ""
                : "none";
    });
}

function buildResults(category = "All") {
    const db = getDB();

    const results = db.projects
        .filter(p => category === "All" || p.category === category)
        .map(project => {

            const submitted = db.marks.filter(m => m.projectId === project.id && m.submitted);
            if (!submitted.length) return null;

            const assignedCount = db.assignments.filter(a => a.projectId === project.id).length;
            const totals = submitted.map(calculateMarkTotal);
            const average = totals.reduce((a, b) => a + b, 0) / totals.length;
            const stdDev = totals.length >= 2
                ? Math.sqrt(totals.reduce((s, t) => s + (t - average) ** 2, 0) / totals.length)
                : null;

            const judgeBreakdown = submitted.map(m => {
                const judge = db.judges.find(j => j.id === m.judgeId);
                return {
                    name: judge?.name || "Former judge",
                    total: calculateMarkTotal(m),
                    deviation: totals.length >= 2 ? calculateMarkTotal(m) - average : null
                };
            });

            return { project, submittedCount: submitted.length, assignedCount, average, stdDev, judgeBreakdown };
        })
        .filter(Boolean)
        .sort((a, b) => b.average - a.average || b.submittedCount - a.submittedCount);

    /* competition ranking (ties share a rank) */
    let prevAvg = null, rank = 0;
    results.forEach((r, i) => {
        if (prevAvg === null || r.average < prevAvg - 1e-9) { rank = i + 1; prevAvg = r.average; }
        r.rank = rank;
    });

    return results;
}

    const db = getDB();
    const maxJudges = MAX_PROJECT_JUDGES;

    const rows = [[
        "Rank", "Project Code", "Project Title", "School", "Category",
        ...Array.from({ length: maxJudges }, (_, i) => `Judge ${i + 1} Total`),
        "Submitted Judges", "Average Score", "Std Dev"
    ]];

    results.forEach(r => {
        const judgeCols = Array.from({ length: maxJudges }, (_, i) =>
            r.judgeBreakdown[i] ? `${r.judgeBreakdown[i].name}: ${r.judgeBreakdown[i].total}` : "");
        rows.push([
            r.rank,
            r.project.projectCode,
            r.project.title,
            r.project.school,
            r.project.category,
            ...judgeCols,
            r.submittedCount,
            r.average.toFixed(2),
            r.stdDev !== null ? r.stdDev.toFixed(2) : ""
        ]);
    });

    const csv = rows.map(row =>
        row.map(v => `"${String(v).replaceAll('"', '""')}"`).join(",")
    ).join("\n");

    downloadBlob(csv, `innokenya-results${resultsCategoryFilter !== "All" ? "-" + resultsCategoryFilter.toLowerCase().replace(/[^a-z0-9]+/g, "-") : ""}.csv`, "text/csv;charset=utf-8;");

    addAuditLog(currentUser(), "Results exported",
        `Competition results exported as CSV${resultsCategoryFilter !== "All" ? ` (category: ${resultsCategoryFilter})` : ""}.`);
}

function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

function filterConflictTable() {
    const search =
        (document.getElementById("conflictSearch")?.value || "")
        .toLowerCase();

    const status =
        document.getElementById("conflictStatusFilter")?.value || "all";

    const category =
        document.getElementById("conflictCategoryFilter")?.value || "all";

    document.querySelectorAll(".conflict-row").forEach(row => {
        const matchesSearch =
            row.dataset.search.includes(search);

        const matchesStatus =
            status === "all" || row.dataset.status === status;

        const matchesCategory =
            category === "all" || row.dataset.category === category;

        row.style.display =
            matchesSearch && matchesStatus && matchesCategory
                ? ""
                : "none";
    });
}

/* =========================================================
   RESOLVE CONFLICT
   ========================================================= */

function resolveConflict(conflictId) {
    const session = getSession();

    if (!session || session.role !== "admin") {
        showToast(
            "Only an administrator can resolve conflicts.",
            "danger"
        );
        return;
    }

    const db = getDB();

    const conflict = (db.conflicts || []).find(
        c => String(c.id) === String(conflictId)
    );

    if (!conflict) {
        showToast("Conflict record not found.", "danger");
        return;
    }

    if (conflict.status === "Resolved") {
        showToast("This conflict has already been resolved.", "warning");
        return;
    }

    const confirmed = confirm(
        "Resolve this conflict report?\n\n" +
        "Make sure the affected judge's assignment has been reviewed."
    );

    if (!confirmed) return;

    conflict.status = "Resolved";
    conflict.resolvedAt = new Date().toISOString();
    conflict.resolvedBy = session.userId || session.id || "admin";

    saveDB(db);

    if (typeof addAuditLog === "function") {
        addAuditLog(
            currentUser(),
            "Conflict resolved",
            `Conflict ${conflict.id} was marked as resolved.`
        );
    }

    showToast("Conflict marked as resolved.", "success");

    renderConflictsRefresh();
}

function exportBackup() {
    const db = getDB();
    downloadBlob(JSON.stringify(db, null, 2), `innokenya-backup-${new Date().toISOString().slice(0, 10)}.json`, "application/json");
    addAuditLog(currentUser(), "Backup exported", "A full database backup was exported.");
    showToast("Backup downloaded.");
}

function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
        try {
            const data = normalizeDB(JSON.parse(reader.result));
            saveDB(data);
            addAuditLog(currentUser(), "Backup imported", `A backup file (${file.name}) was imported.`);
            showToast("Backup imported successfully.");
            renderApp();
        } catch {
            showToast("Invalid backup file. Import cancelled.", "danger");
        }
    };
    reader.readAsText(file);
    event.target.value = "";
}

/* =========================================================

========================================================= */

function getScoreSchemaTotal() {

    return SCORE_SCHEMA.reduce((total, part) => {

        return total +
            part.criteria.reduce(
                (partTotal, criterion) =>
                    partTotal + Number(criterion.max),
                0
            );

    }, 0);

}


/*
 * The official total is 80.
 *
 * This check also protects the system if the marking
 * scheme is accidentally changed later.
 */
if (getScoreSchemaTotal() !== 80) {

    console.error(
        "KSEF SCORE SCHEMA ERROR: Expected 80 marks, got " +
        getScoreSchemaTotal()
    );

}

/* =========================================================
   RENDER JUDGE EVALUATION
========================================================= */

function renderJudgeEvaluate(projectId) {

    const db = getDB();
    const judge = getCurrentJudge();

    const project =
        db.projects.find(p => p.id === projectId);


    if (!judge || !project) {

        return `
            <div class="glass-card">
                ${emptyState(
                    "fa-lock",
                    "Evaluation unavailable",
                    "The requested project could not be found."
                )}
            </div>
        `;

    }


    /*
     * ONLY THE ASSIGNED JUDGE CAN EVALUATE
     */
    const assigned =
        db.assignments.some(
            a =>
                a.projectId === projectId &&
                a.judgeId === judge.id
        );


    if (!assigned) {

        return `
            <div class="glass-card">
                ${emptyState(
                    "fa-ban",
                    "Access denied",
                    "You are not assigned to this project."
                )}
            </div>
        `;

    }


    /*
     * CONFLICT CHECK
     */
    const conflict =
        db.conflicts.find(
            c =>
                c.projectId === projectId &&
                c.judgeId === judge.id &&
                c.status === "active"
        );


    if (conflict) {

        return `
            <div class="glass-card">
                ${emptyState(
                    "fa-triangle-exclamation",
                    "Conflict Declared",
                    "You cannot evaluate a project for which you have declared a conflict."
                )}
            </div>
        `;

    }


    /*
     * FIND THIS JUDGE'S EVALUATION
     */
    const mark =
        db.marks.find(
            m =>
                m.projectId === projectId &&
                m.judgeId === judge.id
        );


    /*
     * ALREADY SUBMITTED = LOCKED
     */
    if (mark?.submitted === true) {

        return renderSubmittedEvaluation(
            project,
            mark
        );

    }


    evaluationDirty = false;


    return `

        <div class="page-heading">

            <div>

                <h1 class="page-title">
                    Project Evaluation
                </h1>

                <p class="page-description">
                    ${escapeHtml(project.projectCode)}

                    ${escapeHtml(project.title)}
                </p>

            </div>


            <button
                class="btn btn-light no-print"
                onclick="navigateTo('judge-dashboard')"
            >
                <i class="fa-solid fa-arrow-left me-2"></i>
                Back to Projects
            </button>

        </div>


        <!-- PROJECT INFORMATION -->

        <div class="glass-card section-card">

            <div class="card-padding">

                <div class="row">

                    <div class="col-md-8">

                        <div class="project-code">
                            ${escapeHtml(project.projectCode)}
                        </div>

                        <h2 class="h5 fw-bold mt-1">
                            ${escapeHtml(project.title)}
                        </h2>

                        <div class="project-meta">

                            <strong>School:</strong>
                            ${escapeHtml(project.school)}
                            <br>

                            <strong>Students:</strong>
                            ${escapeHtml(project.students)}
                            <br>

                            <strong>Class:</strong>
                            ${escapeHtml(project.classLevel)}
                            <br>

                            <strong>Category:</strong>
                            ${escapeHtml(project.category)}

                        </div>

                    </div>


                    <div class="col-md-4 mt-3 mt-md-0"  style="background-color: #eef4ff;">

                        <div class="alert alert-light border small mb-0">

                            <strong>
                                Judge Instructions
                            </strong>

                            <ol class="mb-0 mt-2 ps-3">

                                <li>
                                    Evaluate only this assigned project.
                                </li>

                                <li>
                                    Declare conflicts before scoring.
                                </li>

                                <li>
                                    Respect each criterion's maximum.
                                </li>

        )}

}

/* =========================================================
   SCORE INPUT
========================================================= */

function onScoreInput(
    criterionId,
    max
) {

    const input =
        document.getElementById(
            "score_" + criterionId
        );


    if (!input) return;


    const value =
        Number(input.value);


    input.classList.toggle(
        "is-invalid",

        input.value !== "" &&
        (
            !Number.isFinite(value) ||
            value < 0 ||
            value > max
        )
    );


    evaluationDirty = true;

}


/* =========================================================
   COLLECT SCORES
========================================================= */

function collectScores() {

    const scores = {};
    let valid = true;


    SCORE_SCHEMA.forEach(part => {

        part.criteria.forEach(c => {

            const input =
                document.getElementById(
                    "score_" + c.id
                );


            const value =
                Number(input?.value);


            if (
                !input ||
                input.value === "" ||
                !Number.isFinite(value) ||
                value < 0 ||
                value > c.max
            ) {

                valid = false;

                input?.classList.add(
                    "is-invalid"
                );

            }


            scores[c.id] = value;

        });

    });


    return {
        valid,
        scores
    };

}


/* =========================================================
   CALCULATE PART TOTAL
========================================================= */

function calculatePartTotal(
    scores,
    partId
) {

    const part =
        SCORE_SCHEMA.find(
            p => p.id === partId
        );


    if (!part) return 0;


    return part.criteria.reduce(
        (total, criterion) =>
            total +
            Number(
                scores?.[criterion.id] || 0
            ),
        0
    );

}


/* =========================================================
   CALCULATE TOTAL
   A = 30
   B = 15
   C = 35
   TOTAL = 80
========================================================= */

function calculateMarkTotal(mark) {

    if (!mark?.scores) return 0;


    return SCORE_SCHEMA.reduce(
        (total, part) => {

            return total +
                calculatePartTotal(
                    mark.scores,
                    part.id
                );

        },
        0
    );

}


/* =========================================================
   REVIEW BEFORE SUBMISSION
========================================================= */

function reviewEvaluation(projectId) {

    const db = getDB();


    if (!db.settings.judgingOpen) {

        showToast(
            "Judging is currently closed by the administrator.",
            "danger"
        );

        return;

    }


    const result =
        collectScores();


    if (!result.valid) {

        showToast(
            "Please correct all scores before submitting.",
            "danger"
        );

        return;

    }


    const strengths =
        document
            .getElementById("evalStrengths")
            ?.value
            .trim() || "";


    const recommendations =
        document
            .getElementById("evalRecommendations")
            ?.value
            .trim() || "";


    if (!strengths || !recommendations) {

        showToast(
            "Please complete both Strengths and Recommendations.",
            "danger"
        );

        return;

    }


    const total =
        Object.values(result.scores)
            .reduce(
                (sum, value) =>
                    sum + Number(value),
                0
            );


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Review KSEF Evaluation Before Submission";


    document.getElementById(
        "modalBody"
    ).innerHTML = `

        <div class="alert alert-danger small">

            <i class="fa-solid fa-lock me-2"></i>

            <strong>Important:</strong>

            Once you click
            <strong>Submit & Lock</strong>,
            your marks cannot be changed.

            The completed scoresheet will be stored
            and made available to the administrator
            for the final three-judge tally.

        </div>


        ${SCORE_SCHEMA.map(part => `

            <div class="border rounded mb-3">

                <div class="p-3 bg-light fw-bold d-flex justify-content-between">

                    <span>
                        ${escapeHtml(part.title)}
                    </span>

                    <span>
                        ${calculatePartTotal(
                            result.scores,
                            part.id
                        )}
                        /
                        ${part.max}
                    </span>

                </div>


                ${part.criteria.map(c => `

                    <div class="d-flex justify-content-between p-3 border-top small">

                        <span>
                            ${escapeHtml(c.name)}
                        </span>

                        <strong>
                            ${result.scores[c.id]}
                            /
                            ${c.max}
                        </strong>

                    </div>

                `).join("")}

            </div>

        `).join("")}


        <div class="alert alert-primary">

            <strong>
                Official score submitted by this judge:
            </strong>

            ${total} / 80

        </div>


        <div class="alert alert-light border small">

            <strong>
                Strengths:
            </strong>

            <br>

            ${escapeHtml(strengths)}

            <br><br>

            <strong>
                Recommendations:
            </strong>

            <br>

            ${escapeHtml(recommendations)}

        </div>


        <div class="d-flex justify-content-end gap-2">

            <button
                class="btn btn-light"
                data-bs-dismiss="modal"
            >
                Go Back
            </button>


            <button
                class="btn btn-danger"
                onclick="submitEvaluation('${projectId}')"
            >

                <i class="fa-solid fa-lock me-2"></i>

                Submit & Lock

            </button>

        </div>

    `;


    bootstrap.Modal
        .getOrCreateInstance(
            document.getElementById("mainModal")
        )
        .show();

}


/* =========================================================
   SUBMIT AND PERMANENTLY LOCK
========================================================= */

function submitEvaluation(projectId) {

    const db = getDB();
    const judge = getCurrentJudge();


    if (!judge) {

        showToast(
            "Judge session not found.",
            "danger"
        );

        return;

    }


    if (!db.settings.judgingOpen) {

        showToast(
            "Judging is currently closed by the administrator.",
            "danger"
        );

        return;

    }


    const project =
        db.projects.find(
            p => p.id === projectId
        );


    if (!project) {

        showToast(
            "Project not found.",
            "danger"
        );

        return;

    }


    /*
     * VERIFY ASSIGNMENT AGAIN
     */
    const assigned =
        db.assignments.some(
            a =>
                a.projectId === projectId &&
                a.judgeId === judge.id
        );


    if (!assigned) {

        showToast(
            "You are not assigned to this project.",
            "danger"
        );

        return;

    }


    /*
     * VERIFY CONFLICT AGAIN
     */
    const conflict =
        db.conflicts.find(
            c =>
                c.projectId === projectId &&
                c.judgeId === judge.id &&
                c.status === "active"
        );


    if (conflict) {

        showToast(
            "You cannot evaluate a project with an active conflict.",
            "danger"
        );

        return;

    }


    /*
     * CHECK IF ALREADY LOCKED
     */
    let mark =
        db.marks.find(
            m =>
                m.projectId === projectId &&
                m.judgeId === judge.id
        );


    if (mark?.submitted === true) {

        showToast(
            "This evaluation has already been submitted and locked.",
            "danger"
        );

        return;

    }


    /*
     * COLLECT FINAL SCORES
     */
    const result =
        collectScores();


    if (!result.valid) {

        showToast(
            "Invalid scores. Check every criterion.",
            "danger"
        );

        return;

    }


    const strengths =
        document
            .getElementById("evalStrengths")
            ?.value
            .trim() || "";


    const recommendations =
        document
            .getElementById("evalRecommendations")
            ?.value
            .trim() || "";


    if (!strengths || !recommendations) {

        showToast(
            "Strengths and Recommendations are required.",
            "danger"
        );

        return;

    }


    /*
     * CREATE THE OFFICIAL MARK RECORD
     */
    if (!mark) {

        mark = {

            id: uid("mark"),

            projectId,

            judgeId: judge.id,

            scores: {},

            submitted: false

        };


        db.marks.push(mark);

    }


    /*
     * STORE FINAL SCORES
     */
    mark.scores =
        result.scores;


    mark.strengths =
        strengths;


    mark.recommendations =
        recommendations;


    mark.partATotal =
        calculatePartTotal(
            result.scores,
            "partA"
        );


    mark.partBTotal =
        calculatePartTotal(
            result.scores,
            "partB"
        );


    mark.partCTotal =
        calculatePartTotal(
            result.scores,
            "partC"
        );


    mark.total =
        mark.partATotal +
        mark.partBTotal +
        mark.partCTotal;


    /*
     * PERMANENT LOCK
     */
    mark.submitted = true;

    mark.locked = true;

    mark.submittedAt = now();

    mark.lockedAt = now();

    mark.savedAt = now();


    /*
     * IMPORTANT:
     * Save immediately so the completed
     * scoresheet goes into the database
     * used by the Admin Portal.
     */
    saveDB(db);


    /*
     * ADMIN AUDIT TRAIL
     */
    addAuditLog(
        judge,
        "Evaluation submitted and locked",
        `${judge.name} submitted and permanently locked the evaluation for project ${project.projectCode}.`
    );


    saveDB(db);


    evaluationDirty = false;


    closeModal();


    showToast(
        "Evaluation submitted and locked successfully. The marks are now available to the administrator."
    );


    navigateTo(
        "judge-dashboard"
    );

}
