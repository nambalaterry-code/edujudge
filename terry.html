<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNOKENYA | Kenya Science &amp; Engineering Fair</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        /* =========================================================
           BACKGROUND IMAGE
           Paste your "students innovating" photo URL below.
        ========================================================== */
        :root {
            --bg-image: url("black students.jpg.png");

            --navy: #071a35;
            --navy-2: #0b2850;
            --blue: #1769e0;
            --blue-light: #4b91ff;
            --cyan: #18b8d8;
            --white: #ffffff;
            --text: #10233f;
            --muted: #66758a;
            --border: rgba(255,255,255,.25);
            --glass: rgba(255,255,255,.88);
            --glass-dark: rgba(7,26,53,.82);
            --success: #198754;
            --warning: #f59e0b;
            --danger: #dc3545;
            --shadow: 0 15px 45px rgba(4,20,45,.13);
            --radius: 18px;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background:
                linear-gradient(rgba(4,20,43,.78), rgba(4,20,43,.78)),
                var(--bg-image),
                radial-gradient(1200px 600px at 20% 0%, #0b2850, #040f22);
            background-size: cover, cover, cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(24,184,216,.12), transparent 30%),
                radial-gradient(circle at 85% 70%, rgba(75,145,255,.14), transparent 32%);
            z-index: -1;
        }

        button, input, select, textarea { font-family: inherit; }
        .hidden { display: none !important; }
        .cursor-pointer { cursor: pointer; }

        /* =========================
           BRAND / HEADER
        ========================== */

        .site-header {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(5,20,43,.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,.12);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .engine-logo {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #ffffff, #dceaff);
            color: var(--navy);
            font-size: 21px;
            box-shadow: 0 6px 18px rgba(0,0,0,.18);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: .5px;
        }

        .brand-subtitle {
            font-size: 10px;
            opacity: .72;
            letter-spacing: .6px;
            text-transform: uppercase;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-user-info { text-align: right; }
        .header-user-name { font-weight: 700; font-size: 13px; }
        .header-user-role { font-size: 10px; opacity: .65; text-transform: uppercase; }

        #navToggle { display: none; }

        /* =========================
           FOOTER MARQUEE
        ========================== */

        .moving-footer {
            overflow: hidden;
            background: rgba(4,16,34,.94);
            color: white;
            border-top: 1px solid rgba(255,255,255,.1);
            height: 40px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .footer-track {
            display: inline-flex;
            min-width: max-content;
            animation: marquee 25s linear infinite;
        }

        .footer-item {
            padding-right: 55px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        @keyframes marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        /* =========================
           AUTH / LANDING
        ========================== */

        .auth-wrapper {
            min-height: calc(100vh - 116px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: min(460px, 100%);
            background: rgba(255,255,255,.9);
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0,0,0,.22);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 34px;
        }

        .auth-card.wide { width: min(680px, 100%); }

        .auth-logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, var(--navy), var(--blue));
            color: white;
            font-size: 28px;
            box-shadow: 0 12px 28px rgba(23,105,224,.28);
        }

        .auth-title {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .landing-hero {
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 30px;
            align-items: stretch;
        }

        .landing-panel {
            background: rgba(7,26,53,.72);
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 38px;
            color: white;
            box-shadow: 0 25px 70px rgba(0,0,0,.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .landing-panel h1 {
            font-size: 40px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: .5px;
            margin: 0 0 8px;
        }

        .landing-panel .tagline {
            color: rgba(255,255,255,.75);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .feature-list {
            display: grid;
            gap: 12px;
            margin-bottom: 26px;
        }

        .feature-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 13px;
            color: rgba(255,255,255,.88);
        }

        .feature-item i {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: rgba(75,145,255,.18);
            color: var(--blue-light);
        }

        .landing-stats {
            display: flex;
            gap: 26px;
            border-top: 1px solid rgba(255,255,255,.14);
            padding-top: 20px;
        }

        .landing-stat-num {
            font-size: 22px;
            font-weight: 800;
            color: var(--blue-light);
        }

        .landing-stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: rgba(255,255,255,.6);
        }

        .form-label { font-weight: 600; font-size: 13px; margin-bottom: 7px; }

        .form-control, .form-select {
            min-height: 46px;
            border-radius: 11px;
            border: 1px solid #dbe3ed;
            font-size: 13px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23,105,224,.1);
        }

        .btn-main {
            background: linear-gradient(135deg, var(--blue), #0e55bd);
            border: none;
            color: white;
            min-height: 46px;
            border-radius: 11px;
            font-weight: 700;
            transition: .2s;
        }

        .btn-main:hover, .btn-main:focus {
            transform: translateY(-1px);
            color: white;
            box-shadow: 0 8px 20px rgba(23,105,224,.25);
        }

        .btn-main:disabled {
            opacity: .6;
            transform: none;
        }

        .btn-outline-main {
            border: 1px solid #bdd2f2;
            color: var(--blue);
            background: rgba(255,255,255,.6);
            min-height: 44px;
            border-radius: 10px;
            font-weight: 700;
        }

        .btn-outline-main:hover {
            background: #eef4ff;
            color: var(--blue);
            border-color: #bdd2f2;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8996a7;
            font-size: 11px;
            margin: 22px 0;
        }

        .auth-divider::before, .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dde4ec;
        }

        .auth-links { display: grid; gap: 9px; }

        .auth-link {
            text-align: center;
            padding: 11px;
            border-radius: 10px;
            background: #f5f8fc;
            color: var(--blue);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .15s;
        }

        .auth-link:hover { background: #eaf1fb; }

        /* =========================
           APP LAYOUT
        ========================== */

        .app-shell {
            min-height: calc(100vh - 116px);
            display: flex;
        }

        .sidebar {
            width: 245px;
            flex-shrink: 0;
            background: rgba(5,20,43,.9);
            color: white;
            padding: 20px 13px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-right: 1px solid rgba(255,255,255,.1);
        }

        .sidebar-heading {
            color: rgba(255,255,255,.45);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px 13px 7px;
            font-weight: 700;
        }

        .nav-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: rgba(255,255,255,.72);
            padding: 11px 13px;
            border-radius: 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 3px;
            transition: .2s;
        }

        .nav-btn i { width: 18px; text-align: center; }
        .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,.11); }
        .nav-btn.active { box-shadow: inset 3px 0 0 var(--blue-light); }

        .app-main { flex: 1; padding: 27px; min-width: 0; }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 25px;
            font-weight: 800;
            color: white;
            margin: 0;
        }

        .page-description {
            margin: 5px 0 0;
            color: rgba(255,255,255,.67);
            font-size: 12px;
        }

        /* =========================
           GLASS CARDS
        ========================== */

        .glass-card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,.65);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);
        }

        .card-padding { padding: 20px; }

        .stat-card { padding: 20px; min-height: 125px; position: relative; overflow: hidden; }
        .stat-icon {
            width: 43px; height: 43px; border-radius: 12px;
            display: grid; place-items: center;
            background: #e9f2ff; color: var(--blue);
            margin-bottom: 13px;
        }
        .stat-number { font-size: 27px; font-weight: 800; line-height: 1; }
        .stat-label { color: var(--muted); font-size: 11px; margin-top: 6px; font-weight: 600; }

        .section-card { margin-bottom: 20px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 17px 20px;
            border-bottom: 1px solid #e8edf3;
            flex-wrap: wrap;
        }

        .section-title { font-size: 14px; font-weight: 800; margin: 0; }

        .table-wrap { overflow-x: auto; }

        .table { margin: 0; min-width: 760px; }

        .table th {
            color: #718096;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 800;
            padding: 13px 16px;
            border-bottom: 1px solid #e5ebf2;
            white-space: nowrap;
        }

        .table td {
            font-size: 12px;
            padding: 14px 16px;
            vertical-align: middle;
            border-color: #edf1f5;
        }

        .table tr.row-clickable { cursor: pointer; }
        .table tr.row-clickable:hover { background: #f6f9fd; }

        .empty-state { text-align: center; padding: 55px 25px; color: var(--muted); }
        .empty-icon {
            width: 56px; height: 56px; margin: 0 auto 14px;
            display: grid; place-items: center;
            border-radius: 16px; background: #f0f5fb; color: #7890ad;
            font-size: 21px;
        }
        .empty-title { color: var(--text); font-weight: 800; font-size: 14px; margin-bottom: 5px; }
        .empty-text { font-size: 12px; max-width: 430px; margin: auto; }

        /* =========================
           BADGES / CHIPS
        ========================== */

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border-radius: 30px;
            padding: 5px 9px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-success { color: #087443; background: #e7f7ef; }
        .status-warning { color: #9a6100; background: #fff4dc; }
        .status-danger  { color: #a51e2b; background: #fdecef; }
        .status-info    { color: #075da8; background: #e7f2ff; }
        .status-muted   { color: #66758a; background: #edf1f5; }
        .status-purple  { color: #5b2d8e; background: #f1e9fb; }

        .judge-score-chip {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            background: #eef4ff;
            color: #0e55bd;
            font-size: 11px;
            font-weight: 700;
            margin: 2px 2px 2px 0;
        }

        .judge-score-chip.low  { background: #fdecef; color: #a51e2b; }
        .judge-score-chip.high { background: #e7f7ef; color: #087443; }

        .rank-medal {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: inline-grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px;
            background: #edf1f5;
            color: #66758a;
        }

        .rank-medal.gold   { background: linear-gradient(145deg,#ffd76a,#e8a93d); color: #5b3a00; }
        .rank-medal.silver { background: linear-gradient(145deg,#e8edf3,#b9c4d2); color: #3c4a5c; }
        .rank-medal.bronze { background: linear-gradient(145deg,#f0b285,#c47b45); color: #5a2d0c; }

        /* =========================
           CATEGORY CARDS
        ========================== */

        .category-card { padding: 17px; height: 100%; transition: .2s; position: relative; }
        .category-card:hover { transform: translateY(-2px); }
        .category-card.disabled { opacity: .55; }
        .category-card.disabled .category-name { text-decoration: line-through; }

        .category-number {
            width: 32px; height: 32px;
            display: grid; place-items: center;
            border-radius: 9px;
            background: #e9f2ff; color: var(--blue);
            font-size: 11px; font-weight: 800;
            margin-bottom: 12px;
        }

        .category-name { font-weight: 800; font-size: 12px; min-height: 34px; }

        .category-meta {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 10px;
            margin-top: 13px;
            gap: 8px;
        }

        .category-toggle {
            position: absolute;
            top: 12px; right: 12px;
            border: none;
            background: transparent;
            color: #9fb0c3;
            font-size: 13px;
            padding: 4px;
            border-radius: 6px;
        }

        .category-toggle:hover { color: var(--blue); background: #eef4ff; }

        /* =========================
           PROJECT / JUDGE CARDS
        ========================== */

        .project-card { padding: 19px; height: 100%; transition: .2s; }
        .project-card:hover { transform: translateY(-2px); }

        .project-code { color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: .7px; }
        .project-title { font-size: 15px; font-weight: 800; margin: 5px 0; }
        .project-meta { color: var(--muted); font-size: 11px; line-height: 1.7; }

        .avatar-circle {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: inline-grid;
            place-items: center;
            background: linear-gradient(145deg, var(--navy), var(--blue));
            color: white;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* =========================
           EVALUATION STEPPER / SCORES
        ========================== */

        .stepper {
            display: flex;
            gap: 0;
            margin-bottom: 22px;
            overflow-x: auto;
        }

        .step {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 10px 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: rgba(255,255,255,.55);
            border-bottom: 3px solid rgba(255,255,255,.18);
        }

        .step.done { color: #7ee2a8; border-color: #198754; }
        .step.now  { color: var(--blue-light); border-color: var(--blue-light); }

        .score-section { margin-bottom: 20px; overflow: hidden; }

        .score-header {
            padding: 16px 19px;
            background: linear-gradient(135deg, #08204a, #104b98);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .score-header-title { font-size: 13px; font-weight: 800; }
        .score-header-right { display: flex; align-items: center; gap: 10px; }
        .score-header-total { font-size: 12px; font-weight: 700; white-space: nowrap; }

        .part-subtotal {
            font-size: 10px;
            font-weight: 800;
            background: rgba(255,255,255,.16);
            border-radius: 20px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        .score-row {
            display: grid;
            grid-template-columns: 1fr 90px 130px 108px;
            gap: 15px;
            align-items: center;
            padding: 13px 19px;
            border-bottom: 1px solid #edf1f5;
        }

        .score-row:last-child { border-bottom: none; }

        .criterion { font-size: 12px; font-weight: 600; }
        .criterion-max { color: var(--muted); font-size: 10px; }

        .score-input {
            min-height: 42px !important;
            text-align: center;
            font-weight: 700;
        }

        .score-presets { display: flex; gap: 4px; justify-content: flex-end; }

        .preset-btn {
            border: 1px solid #dbe3ed;
            background: #f5f8fc;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            padding: 5px 8px;
            color: var(--muted);
            transition: .15s;
        }

        .preset-btn:hover { background: #e9f2ff; color: var(--blue); }

        .score-input.is-invalid {
            border-color: var(--danger);
            background: #fdf3f4;
        }

        .score-total-box {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-total-value { font-size: 30px; font-weight: 800; color: var(--blue); }

        /* =========================
           MODALS / TOASTS
        ========================== */

        .modal-content {
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 19px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0,0,0,.22);
        }

        .modal-header { background: #071a35; color: white; border: none; }
        .modal-header .btn-close { filter: invert(1); }
        .modal-title { font-size: 15px; font-weight: 800; }
        .modal-body { padding: 22px; }

        .toast-container { z-index: 3000; }

        /* =========================
           CHARTS / MISC
        ========================== */

        .chart-box { position: relative; height: 240px; }
        .chart-box.tall { height: 320px; }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar .form-control,
        .filter-bar .form-select { min-height: 38px; font-size: 12px; }

        .outlier-note {
            font-size: 10px;
            color: #9a6100;
            background: #fff4dc;
            border-radius: 6px;
            padding: 3px 7px;
            display: inline-block;
            margin-top: 4px;
        }

        .diff-bar {
            height: 6px;
            border-radius: 4px;
            background: #edf1f5;
            overflow: hidden;
            margin-top: 4px;
            width: 90px;
        }

        .diff-bar > div { height: 100%; background: linear-gradient(90deg, var(--blue-light), var(--cyan)); }

        /* =========================
           MOBILE / RESPONSIVE
        ========================== */

        @media (max-width: 991px) {
            .sidebar { display: none; }
            #navToggle { display: inline-flex; }
        }

        @media (max-width: 767px) {
            .landing-hero { grid-template-columns: 1fr; }
            .landing-panel { padding: 26px; }
            .landing-panel h1 { font-size: 30px; }
            .app-main { padding: 18px; }
        }

        @media (max-width: 650px) {
            .site-header { padding: 0 15px; }
            .brand-subtitle, .header-user-info { display: none; }
            .brand-name { font-size: 18px; }
            .app-main { padding: 14px; }
            .page-heading { flex-direction: column; }

/* =========================================================
   HELPERS
========================================================= */

function uid(prefix = "id") {
    return prefix + "_" + Date.now().toString(36) + "_" +
        Math.random().toString(36).substring(2, 9);
}

function now() {
    return new Date().toISOString();
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(date) {
    if (!date) return "—";
    return new Date(date).toLocaleString("en-KE", { dateStyle: "medium", timeStyle: "short" });
}

function initials(name) {
    return String(name || "?")
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(w => w[0].toUpperCase())
        .join("");
}

/* ---------------- Toasts (stacking, themed) ---------------- */

function showToast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    const bg = type === "danger" ? "danger" : type === "warning" ? "warning" : "success";
    const icon = type === "danger" ? "fa-circle-xmark" : type === "warning" ? "fa-triangle-exclamation" : "fa-circle-check";

    const el = document.createElement("div");
    el.className = `toast align-items-center text-bg-${bg} border-0`;
    el.setAttribute("role", "alert");
    el.innerHTML = `
        <div class="d-flex">
            <div class="toast-body">
                <i class="fa-solid ${icon} me-2"></i><span></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>`;
    el.querySelector("span").textContent = message;
    container.appendChild(el);

    const toast = new bootstrap.Toast(el, { delay: 3800 });
    toast.show();
    el.addEventListener("hidden.bs.toast", () => el.remove());
}

/* ---------------- Confirm dialog (replaces native confirm) ---------------- */

let confirmAction = null;

function showConfirm(title, message, confirmLabel, onConfirm, danger = true) {
    confirmAction = onConfirm;
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = `
        <div class="text-center mb-3">
            <div class="empty-icon mx-auto ${danger ? "" : ""}" style="background:${danger ? "#fdecef" : "#e7f2ff"};color:${danger ? "#dc3545" : "#1769e0"}">
                <i class="fa-solid ${danger ? "fa-triangle-exclamation" : "fa-circle-question"}"></i>
            </div>
            <p class="small mb-0" id="confirmMessage"></p>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button class="btn ${danger ? "btn-danger" : "btn-main"}" onclick="runConfirmAction()">
                <i class="fa-solid fa-check me-1"></i>${escapeHtml(confirmLabel)}
            </button>
        </div>`;
    document.getElementById("confirmMessage").textContent = message;
    bootstrap.Modal.getOrCreateInstance(document.getElementById("mainModal")).show();
}

function runConfirmAction() {
    bootstrap.Modal.getInstance(document.getElementById("mainModal"))?.hide();
    const fn = confirmAction;
    confirmAction = null;
    if (typeof fn === "function") setTimeout(fn, 150);
}

/* =========================================================
   DATABASE
========================================================= */

function getDB() {
    let raw = localStorage.getItem(DB_KEY);

    if (!raw) {
        const db = seedDatabase();
        saveDB(db);
        return db;
    }

    try {
        return normalizeDB(JSON.parse(raw));
    } catch {
        const db = seedDatabase();
        saveDB(db);
        return db;
    }
}

function saveDB(db) {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function seedDatabase() {
    /* No fake judges, projects, marks, conflicts or rankings. */

}

function normalizeDB(db) {
    db.users ||= [];
    db.judges ||= [];
    db.judgeRequests ||= [];
    db.projects ||= [];
    db.assignments ||= [];
    db.marks ||= [];
    db.conflicts ||= [];
    db.audit ||= [];

    db.settings ||= {};
    db.settings.eventName ||= "Kenya Science & Engineering Fair";
    db.settings.totalSubmissions =
        Number.isFinite(Number(db.settings.totalSubmissions)) ? Number(db.settings.totalSubmissions) : 0;
    db.settings.maxJudgesPerCategory = Number(db.settings.maxJudgesPerCategory || 3);
    db.settings.disabledCategories ||= [];
    db.settings.judgingOpen = db.settings.judgingOpen !== false;

    return db;
}

function activeCategories() {
    const db = getDB();
    return OFFICIAL_CATEGORIES.filter(c => !db.settings.disabledCategories.includes(c));
}

/* =========================================================
   SESSION  (12h expiry, role guards)
========================================================= */

function getSession() {
    try {
        const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
        if (!s) return null;
        if (!s.loginAt || Date.now() - s.loginAt > SESSION_TTL_MS) {
            clearSession();
            return null;
        }
        return s;
    } catch {
        return null;
    }
}

function setSession(session) {
    session.loginAt = Date.now();
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function clearSession() {
    sessionStorage.removeItem(SESSION_KEY);
}

function currentUser() {
    const session = getSession();
    if (!session) return null;
    const db = getDB();
    const user = db.users.find(u => u.id === session.userId);
    if (!user || user.active === false) return null;
    return user;
}

function addAuditLog(actor, action, details) {
    const db = getDB();
    db.audit.unshift({
        id: uid("audit"),
        actorId: actor?.id || "system",
        actorName: actor?.name || "System",
        action,
        details,
        timestamp: now()
    });
    /* keep the log bounded so localStorage stays healthy */
    if (db.audit.length > 1500) db.audit.length = 1500;
    saveDB(db);
}

/* =========================================================
   LOGIN LOCKOUT (simple brute-force damping)
========================================================= */

const loginGuard = { fails: 0, lockedUntil: 0 };

function loginGuardOk() {
    if (Date.now() < loginGuard.lockedUntil) {
        const secs = Math.ceil((loginGuard.lockedUntil - Date.now()) / 1000);
        showToast(`Too many failed attempts. Try again in ${secs}s.`, "danger");
        return false;
    }
    return true;
}

function loginGuardFail() {
    loginGuard.fails++;
    if (loginGuard.fails >= 5) {
        loginGuard.lockedUntil = Date.now() + 30000;
        loginGuard.fails = 0;
        showToast("Too many failed attempts. Locked for 30 seconds.", "danger");
    }
}

function loginGuardReset() {
    loginGuard.fails = 0;
    loginGuard.lockedUntil = 0;
}

const chartRegistry = {};

function renderChart(canvasId, config) {
    const el = document.getElementById(canvasId);

    if (chartRegistry[canvasId]) {
        chartRegistry[canvasId].destroy();
        delete chartRegistry[canvasId];
    }
    chartRegistry[canvasId] = new Chart(el.getContext("2d"), config);
}

/* =========================================================

========================================================= */

let currentPage = "landing";
let currentParams = {};

function navigateTo(page, params = {}) {
    const session = getSession();

    /*
     * ACCESS CONTROL
     *
     * Judge:
     *   - Can access judge pages
     *   - Cannot access admin pages
     *
     * Admin:
     *   - Can access admin pages
     *   - Can ALSO access judge pages
     *
     * Not logged in:
     *   - Can only access public/login pages
     */

    // ADMIN PAGE PROTECTION
    if (page.startsWith("admin-")) {
        if (!session || session.role !== "admin") {
            showToast("Admin access required.", "danger");

            if (session && session.role === "judge") {
                page = "judge-dashboard";
            } else {
                page = "admin-login";
            }
        }
    }

    // JUDGE PAGE PROTECTION
    // IMPORTANT:
    // Admins ARE allowed to access judge pages.
    if (page.startsWith("judge-")) {
        if (!session) {
            showToast("Please sign in to access the Judge Portal.", "warning");
            page = "judge-login";
        } 
        else if (session.role !== "judge" && session.role !== "admin") {
            showToast("You do not have access to the Judge Portal.", "danger");
            page = "landing";
        }
    }

    // Handle unsaved evaluation changes
    if (
        evaluationDirty &&
        currentPage === "judge-evaluate" &&
        page !== "judge-evaluate"
    ) {
        showToast(
            "Unsaved evaluation changes were discarded.",
            "warning"
        );

        evaluationDirty = false;
    }

    currentPage = page;
    currentParams = params;

    renderApp();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function renderApp() {
    const app = document.getElementById("app");
    const session = getSession();

    updateHeader();

    /*
     * NO SESSION
     */
    if (!session) {
        evaluationDirty = false;

        if (currentPage === "register-judge") {
            app.innerHTML = renderJudgeRegistration();
            return;
        }

        if (currentPage === "admin-login") {
            app.innerHTML = renderAdminLogin();
            return;
        }

        if (currentPage === "judge-login") {
            app.innerHTML = renderJudgeLogin();
            return;
        }

        if (currentPage === "verify") {
            app.innerHTML = renderVerificationPage();
            return;
        }

        app.innerHTML = renderLanding();
        return;
    }


    /*
     * ADMIN SESSION
     *
     * Admin can access BOTH:
     * - Admin Portal
     * - Judge Portal
     */
    if (session.role === "admin") {

        // Admin visiting a judge page
        if (currentPage.startsWith("judge-")) {
            app.innerHTML = renderJudgeLayout();
            return;
        }

        // Admin visiting an admin page
        app.innerHTML = renderAdminLayout();
        afterRender();
        return;
    }


    /*
     * JUDGE SESSION
     *

        if (!judge) {

            showToast(

            navigateTo("judge-dashboard");
            return;
        }

        app.innerHTML = renderJudgeLayout();
        return;
    }


    /*

     */
    clearSession();
    navigateTo("landing");
}

function togglePassword(inputId, button) {

/* =========================================================
   JUDGE LOGIN
   ========================================================= */

function judgeLogin(event) {

    event.preventDefault();


    if (typeof loginGuardOk === "function") {

        if (!loginGuardOk()) {
            return;
        }

    }


    const identifier =
        document
            .getElementById("judgeLoginIdentifier")
            ?.value
            ?.trim();

    const password =
        document
            .getElementById("judgeLoginPassword")
            ?.value || "";


    if (!identifier || !password) {

        showToast(
            "Please enter your Judge ID/email and password.",
            "warning"
        );

        return;
    }


    const db = getDB();


    /* ---------------------------------------------------------
       FIND JUDGE
       --------------------------------------------------------- */

    const identifierLower =
        identifier.toLowerCase();


    const judge =
        (db.judges || []).find(judge => {

            const judgeId =
                String(judge.judgeId || "")
                    .toLowerCase();

            const email =
                String(judge.email || "")
                    .toLowerCase();

            return (
                judgeId === identifierLower ||
                email === identifierLower
            );

        });


    if (!judge) {

        showToast(
            "Judge account not found or not yet approved.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK ACCOUNT STATUS
       --------------------------------------------------------- */

    if (
        judge.status &&
        judge.status !== "active" &&
        judge.status !== "approved"
    ) {

        showToast(
            "Your judge account is not active.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK VERIFICATION
       --------------------------------------------------------- */

    if (
        judge.verified === false ||
        judge.emailVerified === false
    ) {

        showToast(
            "Please verify your email before signing in.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       FIND USER ACCOUNT
       --------------------------------------------------------- */

    const user =
        (db.users || []).find(user => {

            if (
                judge.userId &&
                user.id === judge.userId
            ) {
                return true;
            }


            const userEmail =
                String(user.email || "")
                    .toLowerCase();

            const judgeEmail =
                String(judge.email || "")
                    .toLowerCase();


            return (
                userEmail &&
                judgeEmail &&
                userEmail === judgeEmail
            );

        });


    if (!user) {

        showToast(
            "Login account could not be found.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK PASSWORD
       --------------------------------------------------------- */

    if (user.password !== password) {

        showToast(
            "Incorrect password.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CREATE SESSION
       --------------------------------------------------------- */

    setSession({

        userId: user.id,

        role: "judge"

    });


    /* ---------------------------------------------------------
       AUDIT LOG
       --------------------------------------------------------- */

    if (typeof addAudit === "function") {

        addAudit(
            "Judge Login",
            `Judge ${
                judge.name ||
                judge.judgeId ||
                judge.email
            } signed in`
        );

    }


    /* ---------------------------------------------------------
       SAVE DATABASE
       --------------------------------------------------------- */

    saveDB(db);


    /* ---------------------------------------------------------
       OPEN JUDGE DASHBOARD
       --------------------------------------------------------- */

    navigateTo("judge-dashboard");
}

/* =========================================================
   REGISTER JUDGE
   ========================================================= */

function registerJudge(event) {

    event.preventDefault();


    if (typeof loginGuardOk === "function") {

        if (!loginGuardOk()) {
            return;
        }

    }


    const name =
        document
            .getElementById("registerJudgeName")
            ?.value
            ?.trim();


    const judgeId =
        document
            .getElementById("registerJudgeId")
            ?.value
            ?.trim();


    const email =
        document
            .getElementById("registerJudgeEmail")
            ?.value
            ?.trim();


    const phone =
        document
            .getElementById("registerJudgePhone")
            ?.value
            ?.trim();


    const category =
        document
            .getElementById("registerJudgeCategory")
            ?.value;


    const password =
        document
            .getElementById("registerJudgePassword")
            ?.value || "";


    const confirmPassword =
        document
            .getElementById("registerJudgeConfirmPassword")
            ?.value || "";


    /* ---------------------------------------------------------
       REQUIRED FIELDS
       --------------------------------------------------------- */

    if (
        !name ||
        !judgeId ||
        !email ||
        !category
    ) {

        showToast(
            "Please complete all required fields.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       PASSWORD LENGTH
       --------------------------------------------------------- */

    if (password.length < 6) {

        showToast(
            "Password must contain at least 6 characters.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       PASSWORD MATCH
       --------------------------------------------------------- */

    if (password !== confirmPassword) {

        showToast(
            "Passwords do not match.",
            "danger"
        );

        return;
    }


    const db = getDB();


    /* ---------------------------------------------------------
       NORMALIZE ID AND EMAIL
       --------------------------------------------------------- */

    const normalizedJudgeId =
        judgeId.toLowerCase();

    const normalizedEmail =
        email.toLowerCase();


    /* ---------------------------------------------------------
       CHECK EXISTING APPROVED JUDGES
       --------------------------------------------------------- */

    const existingJudge =
        (db.judges || []).find(judge => {

            const existingId =
                String(judge.judgeId || "")
                    .toLowerCase();

            const existingEmail =
                String(judge.email || "")
                    .toLowerCase();


            return (
                existingId === normalizedJudgeId ||
                existingEmail === normalizedEmail
            );

        });


    if (existingJudge) {

        showToast(
            "A judge with this ID or email already exists.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK PENDING REQUESTS
       --------------------------------------------------------- */

    const existingRequest =
        (db.judgeRequests || []).find(request => {

            const existingId =
                String(request.judgeId || "")
                    .toLowerCase();

            const existingEmail =
                String(request.email || "")
                    .toLowerCase();


            return (
                existingId === normalizedJudgeId ||
                existingEmail === normalizedEmail
            );

        });


    if (existingRequest) {

        showToast(
            "A registration request with this Judge ID or email is already pending.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       CATEGORY CAPACITY
       --------------------------------------------------------- */

    const approvedInCategory =
        (db.judges || []).filter(judge =>

            judge.category === category &&

            (
                judge.status === "active" ||
                judge.status === "approved"
            )

        ).length;


    const pendingInCategory =
        (db.judgeRequests || []).filter(request =>

            request.category === category &&
            request.status === "pending"

        ).length;


    const categoryCapacityWarning =
        approvedInCategory +
        pendingInCategory >= 3;


    /* ---------------------------------------------------------
       CREATE REQUEST
       --------------------------------------------------------- */

    const request = {

        id:
            "JR-" + Date.now(),

        name:
            name,

        judgeId:
            judgeId,

        email:
            email,

        phone:
            phone,

        category:
            category,

        password:
            password,

        status:
            "pending",

        verified:
            false,

        emailVerified:
            false,

        createdAt:
            new Date().toISOString()

    };


    /* ---------------------------------------------------------
       MAKE SURE REQUEST ARRAY EXISTS
       --------------------------------------------------------- */

    if (!db.judgeRequests) {
        db.judgeRequests = [];
    }


    /* ---------------------------------------------------------
       SAVE REQUEST
       --------------------------------------------------------- */

    db.judgeRequests.push(request);


    /* ---------------------------------------------------------
       AUDIT LOG
       --------------------------------------------------------- */

    if (typeof addAudit === "function") {

        addAudit(
            "Judge Registration",
            `Judge ${name} submitted a registration request`
        );

    }


    /* ---------------------------------------------------------
       SAVE DATABASE
       --------------------------------------------------------- */

    saveDB(db);


    /* ---------------------------------------------------------
       SUCCESS SCREEN
       --------------------------------------------------------- */

    showRegistrationSuccess(
        categoryCapacityWarning
    );
}

                String(judge.judgeId || "")
                    .toLowerCase();

            const email =
                String(judge.email || "")
                    .toLowerCase();

            return (
                judgeId === identifierLower ||
                email === identifierLower
            );

        });


    if (!judge) {

        showToast(
            "Judge account not found or not yet approved.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK JUDGE STATUS
       --------------------------------------------------------- */

    if (
        judge.status &&
        judge.status !== "active" &&
        judge.status !== "approved"
    ) {

        showToast(
            "Your judge account is not active.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK VERIFICATION
       --------------------------------------------------------- */

    if (
        judge.verified === false ||
        judge.emailVerified === false
    ) {

        showToast(
            "Please verify your email before signing in.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       FIND USER ACCOUNT
       --------------------------------------------------------- */

    const user =
        db.users.find(user => {

            if (
                judge.userId &&
                user.id === judge.userId
            ) {
                return true;
            }

            const userEmail =
                String(user.email || "")
                    .toLowerCase();

            const judgeEmail =
                String(judge.email || "")
                    .toLowerCase();

            return (
                userEmail &&
                judgeEmail &&
                userEmail === judgeEmail
            );

        });


    if (!user) {

        showToast(
            "Login account could not be found.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       PASSWORD CHECK
       --------------------------------------------------------- */

    if (user.password !== password) {

        showToast(
            "Incorrect password.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CREATE SESSION
       --------------------------------------------------------- */

    setSession({
        userId: user.id,
        role: "judge"
    });


    /* ---------------------------------------------------------
       AUDIT LOG
       --------------------------------------------------------- */

    if (typeof addAudit === "function") {

        addAudit(
            "Judge Login",
            `Judge ${judge.name || judge.judgeId || judge.email} signed in`
        );

    }


    /* ---------------------------------------------------------
       SAVE
       --------------------------------------------------------- */

    saveDB(db);


    /* ---------------------------------------------------------
       GO TO JUDGE DASHBOARD
       --------------------------------------------------------- */

    navigateTo("judge-dashboard");
}

function registerJudge(event) {

    event.preventDefault();

    if (!loginGuardOk()) {
        return;
    }


    const name =
        document
            .getElementById("registerJudgeName")
            ?.value
            ?.trim();

    const judgeId =
        document
            .getElementById("registerJudgeId")
            ?.value
            ?.trim();

    const email =
        document
            .getElementById("registerJudgeEmail")
            ?.value
            ?.trim();

    const phone =
        document
            .getElementById("registerJudgePhone")
            ?.value
            ?.trim();

    const category =
        document
            .getElementById("registerJudgeCategory")
            ?.value;

    const password =
        document
            .getElementById("registerJudgePassword")
            ?.value || "";

    const confirmPassword =
        document
            .getElementById("registerJudgeConfirmPassword")
            ?.value || "";


    /* ---------------------------------------------------------
       BASIC VALIDATION
       --------------------------------------------------------- */

    if (!name || !judgeId || !email || !category) {

        showToast(
            "Please complete all required fields.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       PASSWORD VALIDATION
       --------------------------------------------------------- */

    if (password.length < 6) {

        showToast(
            "Password must contain at least 6 characters.",
            "warning"
        );

        return;
    }


    if (password !== confirmPassword) {

        showToast(
            "Passwords do not match.",
            "danger"
        );

        return;
    }


    const db = getDB();


    /* ---------------------------------------------------------
       NORMALIZED VALUES
       --------------------------------------------------------- */

    const normalizedJudgeId =
        judgeId.toLowerCase();

    const normalizedEmail =
        email.toLowerCase();


    /* ---------------------------------------------------------
       CHECK EXISTING JUDGES
       --------------------------------------------------------- */

    const existingJudge =
        (db.judges || []).find(judge => {

            const existingId =
                String(judge.judgeId || "")
                    .toLowerCase();

            const existingEmail =
                String(judge.email || "")
                    .toLowerCase();

            return (
                existingId === normalizedJudgeId ||
                existingEmail === normalizedEmail
            );

        });


    if (existingJudge) {

        showToast(
            "A judge with this ID or email already exists.",
            "danger"
        );

        return;
    }


    /* ---------------------------------------------------------
       CHECK PENDING REQUESTS
       --------------------------------------------------------- */

    const existingRequest =
        (db.judgeRequests || []).find(request => {

            const existingId =
                String(request.judgeId || "")
                    .toLowerCase();

            const existingEmail =
                String(request.email || "")
                    .toLowerCase();

            return (
                existingId === normalizedJudgeId ||
                existingEmail === normalizedEmail
            );

        });


    if (existingRequest) {

        showToast(
            "A registration request with this Judge ID or email is already pending.",
            "warning"
        );

        return;
    }


    /* ---------------------------------------------------------
       CATEGORY CAPACITY CHECK
       --------------------------------------------------------- */

    const approvedInCategory =
        (db.judges || []).filter(judge =>
            judge.category === category &&
            (
                judge.status === "active" ||
                judge.status === "approved"
            )
        ).length;


    const pendingInCategory =
        (db.judgeRequests || []).filter(request =>
            request.category === category &&
            request.status === "pending"
        ).length;


    const categoryCapacityWarning =
        approvedInCategory + pendingInCategory >= 3;


    /* ---------------------------------------------------------
       CREATE REGISTRATION REQUEST
       --------------------------------------------------------- */

    const request = {

        id:
            "JR-" +
            Date.now(),

        name:
            name,

        judgeId:
            judgeId,

        email:
            email,

        phone:
            phone,

        category:
            category,

        password:
            password,

        status:
            "pending",

        verified:
            false,

        emailVerified:
            false,

        createdAt:
            new Date().toISOString()

    };


    if (!db.judgeRequests) {
        db.judgeRequests = [];
    }


    db.judgeRequests.push(request);


    /* ---------------------------------------------------------
       AUDIT LOG
       --------------------------------------------------------- */

    if (typeof addAudit === "function") {

        addAudit(
            "Judge Registration",
            `Judge ${name} submitted a registration request`
        );

    }


    /* ---------------------------------------------------------
       SAVE DATABASE
       --------------------------------------------------------- */

    saveDB(db);


    /* ---------------------------------------------------------
       SHOW SUCCESS
       --------------------------------------------------------- */

    showRegistrationSuccess(
        categoryCapacityWarning
    );
}

function togglePassword(inputId, btn) {

    const input = document.getElementById(inputId);

    if (!input) return;

    const show = input.type === "password";

    input.type = show ? "text" : "password";

    btn.innerHTML = `
        <i class="fa-solid ${
            show ? "fa-eye-slash" : "fa-eye"
        }"></i>
    `;
}


function judgeLogin(event) {

    event.preventDefault();

    // Check login protection / rate limiting
    if (!loginGuardOk()) return;


    const identifier =
        document
            .getElementById("judgeLoginIdentifier")
            .value
            .trim();

    const password =
        document
            .getElementById("judgeLoginPassword")
            .value;


    const db = getDB();


    /*
     * FIND JUDGE
     *
     * The judge can log in using:
     * - Judge ID
     * - Email
     */
    const judge = db.judges.find(j => {

        const judgeId =
            String(j.judgeId || "").toLowerCase();

        const email =
            String(j.email || "").toLowerCase();

        return (
            (judgeId === identifier.toLowerCase() ||
             email === identifier.toLowerCase()) &&

            j.status === "active" &&

            j.emailVerified === true
        );
    });


    /*
     * JUDGE DOES NOT EXIST,
     * IS NOT APPROVED,
     * IS NOT VERIFIED,
     * OR IS INACTIVE
     */
    if (!judge) {

        loginGuardFail();

        showToast(
            "Account not found, not approved, not verified, or inactive.",
            "danger"
        );

        return;
    }


    /*
     * FIND THE USER ACCOUNT
     */
    const user = db.users.find(
        u => u.id === judge.userId
    );


    /*
     * CHECK PASSWORD
     */
    if (!user || user.password !== password) {

        loginGuardFail();

        showToast(
            "Incorrect login details.",
            "danger"
        );

        return;
    }


    /*
     * SUCCESSFUL LOGIN
     */
    loginGuardReset();


    /*
     * CREATE JUDGE SESSION
     *
     * A normal judge becomes role = "judge".
     *
     * An administrator who wants to use the Judge Portal
     * does NOT need to use this login.
     *
     * The admin can enter the Judge Portal directly from
     * the Admin Portal because navigateTo() allows admins
     * to access judge-* pages.
     */
    setSession({
        userId: user.id,
        role: "judge"
    });


    /*
     * AUDIT LOG
     */
    addAuditLog(
        user,
        "Judge login",
        `${judge.name} signed into the judge portal.`
    );


    /*
     * GO TO JUDGE DASHBOARD
     */
    navigateTo("judge-dashboard");
}

    if (!category) {

        showToast(

        );

    }


    const db = getDB();


    /*
     * CHECK DUPLICATE JUDGE ID
     *
     * Check both approved judges and pending requests.
     */
    const duplicateId =
        db.judges.some(j =>
            String(j.judgeId || "").toLowerCase() ===
            judgeId.toLowerCase()
        ) ||

        db.judgeRequests.some(j =>
            String(j.judgeId || "").toLowerCase() ===
            judgeId.toLowerCase()
        );


    if (duplicateId) {

        showToast(
            "That Judge ID is already registered.",
            "danger"
        );

        return;
    }


    /*
     * CHECK DUPLICATE EMAIL
     */
    const duplicateEmail =
        db.judges.some(j =>
            String(j.email || "").toLowerCase() === email
        ) ||

        db.judgeRequests.some(j =>
            String(j.email || "").toLowerCase() === email
        );


    if (duplicateEmail) {

        showToast(
            "That email is already registered.",
            "danger"
        );

        return;
    }


    /*
     * CHECK CATEGORY CAPACITY
     *
     * The administrator controls the maximum number
     * of judges allowed in each category.
     */
    const max =
        Number(db.settings.maxJudgesPerCategory || 3);

    const activeCount =
        db.judges.filter(j =>
            j.category === category &&
            j.status === "active"
        ).length;


    /*
     * CREATE PENDING REGISTRATION
     */
    const request = {

        id: uid("request"),

        name: name,

        judgeId: judgeId,

        email: email,

        phone: phone,

        category: category,

        password: password,

        status: "pending",

        emailVerified: false,

        createdAt: now()
    };


    /*
     * FLAG CATEGORY CAPACITY
     *
     * This does NOT reject registration.
     * It tells the administrator that the category
     * is already full.
     */
    if (activeCount >= max) {
        request.categoryCapacityWarning = true;
    }


    /*
     * SAVE REQUEST
     */
    db.judgeRequests.push(request);


    /*
     * AUDIT LOG
     */
    addAuditLog(
        {
            id: "public",
            name: name
        },
        "Judge registration submitted",
        `${name} submitted a judge registration request for ${category}.`
    );


    saveDB(db);


    /*
     * SHOW SUCCESS PAGE
     */
    showRegistrationSuccess(
        name,
        category,
        activeCount >= max
    );
}

function adminLogin(event) {

    event.preventDefault();

    if (!loginGuardOk()) return;


    const username =
        document
            .getElementById("adminUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("adminPassword")
            .value;


    const db = getDB();


    /*
     * FIND ACTIVE ADMIN ACCOUNT
     */
    const user = db.users.find(u => {

        const storedUsername =
            String(u.username || "").toLowerCase();

        return (
            u.role === "admin" &&
            storedUsername === username.toLowerCase() &&
            u.password === password &&
            u.active !== false
        );
    });


    /*
     * INVALID LOGIN
     */
    if (!user) {

        loginGuardFail();

        showToast(
            "Incorrect administrator login details.",
            "danger"
        );

        return;
    }


    /*
     * SUCCESSFUL ADMIN LOGIN
     */
    loginGuardReset();


    /*
     * KEEP THE ROLE AS ADMIN
     *
     * This is important because an admin must retain
     * access to the entire Administrator Portal while
     * also being allowed to access the Judge Portal.
     */
    setSession({
        userId: user.id,
        role: "admin"
    });


    /*
     * AUDIT LOG
     */
    addAuditLog(
        user,
        "Administrator login",
        `${user.name} signed into the administrator portal.`
    );


    /*
     * OPEN ADMIN DASHBOARD
     */
    navigateTo("admin-dashboard");
}

    return `

function filterProjectTable() {
    const search = document.getElementById("projectSearch")?.value.toLowerCase().trim() || "";
    const cat = document.getElementById("projectCatFilter")?.value || "";

    document.querySelectorAll("#projectTable tbody tr").forEach(row => {
        const matchText = !search || row.dataset.search.includes(search);
        const matchCat = !cat || row.dataset.cat === cat;
        row.style.display = matchText && matchCat ? "" : "none";
    });
}

                </div>

function saveProject(event, id) {
    event.preventDefault();

    const db = getDB();
    const actor = currentUser();

    const projectCode = document.getElementById("projectCode").value.trim();
    const title = document.getElementById("projectTitle").value.trim();
    const school = document.getElementById("projectSchool").value.trim();
    const students = document.getElementById("projectStudents").value.trim();
    const classLevel = document.getElementById("projectClass").value.trim();
    const category = document.getElementById("projectCategory").value;

    if (db.projects.some(p => p.projectCode.toLowerCase() === projectCode.toLowerCase() && p.id !== id)) {
        showToast("Project code already exists.", "danger");
        return;
    }

    if (id) {
        const project = db.projects.find(p => p.id === id);
        if (!project) return;

        const oldCategory = project.category;

        Object.assign(project, { projectCode, title, school, students, classLevel, category, updatedAt: now() });

        if (oldCategory !== category) {
            db.assignments = db.assignments.filter(a => a.projectId !== id);
        }

        saveDB(db);
        addAuditLog(actor, "Project edited", `Project ${projectCode} was edited.`);
        closeModal();
        showToast("Project updated successfully.");
        renderApp();
    } else {
        db.projects.push({
            id: uid("project"), projectCode, title, school, students, classLevel, category, createdAt: now()
        });
        saveDB(db);
        addAuditLog(actor, "Project added", `Project ${projectCode} was registered.`);
        closeModal();
        showToast("Project registered successfully.");
        renderApp();
    }
}

function deleteProject(id) {
    const db = getDB();
    const project = db.projects.find(p => p.id === id);
    if (!project) return;

    showConfirm(
        "Delete Project",
        `Delete "${project.title}" (${project.projectCode})? Its assignments, marks and conflicts will also be removed. This cannot be undone.`,
        "Delete Project",
        () => {
            db.projects = db.projects.filter(p => p.id !== id);
            db.assignments = db.assignments.filter(a => a.projectId !== id);
            db.marks = db.marks.filter(m => m.projectId !== id);
            db.conflicts = db.conflicts.filter(c => c.projectId !== id);

            saveDB(db);
            addAuditLog(currentUser(), "Project deleted", `Project ${project.projectCode} was deleted.`);
            showToast("Project deleted.");
            renderApp();
        }
    );
}

function filterJudgeTable() {
    const search = document.getElementById("judgeSearch")?.value.toLowerCase().trim() || "";
    const cat = document.getElementById("judgeCatFilter")?.value || "";
    const status = document.getElementById("judgeStatusFilter")?.value || "";

    document.querySelectorAll("#judgeTable tbody tr").forEach(row => {
        const match = (!search || row.dataset.search.includes(search)) &&
                      (!cat || row.dataset.cat === cat) &&
                      (!status || row.dataset.status === status);
        row.style.display = match ? "" : "none";
    });
}

function toggleSelectAllRequests(master) {
    document.querySelectorAll(".req-check").forEach(cb => cb.checked = master.checked);
}

function selectedRequestIds() {
    return [...document.querySelectorAll(".req-check:checked")].map(cb => cb.value);
}

function batchApproveRequests() {
    const ids = selectedRequestIds();
    if (!ids.length) { showToast("Select at least one request.", "warning"); return; }

    showConfirm("Approve Selected Judges",
        `Approve ${ids.length} selected registration request(s)? Each judge must have a free slot in their category.`,
        "Approve Selected",
        () => {
            let approved = 0, skipped = 0;
            ids.forEach(id => { approveJudge(id, true) ? approved++ : skipped++; });
            showToast(`${approved} approved${skipped ? `, ${skipped} skipped (category full)` : ""}.`,
                skipped ? "warning" : "success");
            renderApp();
        });
}

function batchRejectRequests() {
    const ids = selectedRequestIds();
    if (!ids.length) { showToast("Select at least one request.", "warning"); return; }

    showConfirm("Reject Selected Judges",
        `Reject ${ids.length} selected registration request(s)? This cannot be undone.`,
        "Reject Selected",
        () => {
            const db = getDB();
            ids.forEach(id => {
                const r = db.judgeRequests.find(x => x.id === id);
                if (r && r.status === "pending") {
                    r.status = "rejected";
                    r.rejectedAt = now();
                    addAuditLog(currentUser(), "Judge registration rejected",
                        `${r.name}'s registration was rejected.`);
                }
            });
            saveDB(db);
            showToast("Selected requests rejected.");
            renderApp();
        });
}

function saveJudge(event, id) {
    event.preventDefault();

    const db = getDB();
    const actor = currentUser();

    const name = document.getElementById("judgeName").value.trim();
    const judgeId = document.getElementById("judgeId").value.trim();
    const email = document.getElementById("judgeEmail").value.trim().toLowerCase();
    const phone = document.getElementById("judgePhone").value.trim();
    const category = document.getElementById("judgeCategory").value;
    const password = document.getElementById("judgePassword").value;
    const status = document.getElementById("judgeStatus").value;

    if (db.judges.some(j => j.judgeId.toLowerCase() === judgeId.toLowerCase() && j.id !== id)) {
        showToast("Judge ID already exists.", "danger");
        return;
    }

    if (db.judges.some(j => j.email.toLowerCase() === email && j.id !== id)) {
        showToast("Email already exists.", "danger");
        return;
    }

    const max = Number(db.settings.maxJudgesPerCategory || 3);
    const categoryActive = db.judges.filter(j =>
        j.category === category && j.status === "active" && j.id !== id).length;

    if (status === "active" && categoryActive >= max) {
        showToast(`This category already has ${max} active judges.`, "danger");
        return;
    }

    if (id) {
        const judge = db.judges.find(j => j.id === id);
        if (!judge) return;

        const oldCategory = judge.category;

        judge.name = name;
        judge.judgeId = judgeId;
        judge.email = email;
        judge.phone = phone;
        judge.category = category;
        judge.status = status;
        judge.updatedAt = now();

        const user = db.users.find(u => u.id === judge.userId);
        if (user) {
            user.name = name;
            user.username = email;
            if (password) user.password = password;
            user.active = status === "active";
        }

        if (oldCategory !== category) {
            db.assignments = db.assignments.filter(a => a.judgeId !== id);
        }

        saveDB(db);
        addAuditLog(actor, "Judge edited", `${name}'s judge account was edited.`);
        closeModal();
        showToast("Judge updated successfully.");
        renderApp();
    } else {
        if (!password) { showToast("Password is required.", "danger"); return; }

        const userId = uid("user");

        db.users.push({
            id: userId, username: email, password, role: "judge",
            name, active: status === "active", createdAt: now()
        });

        db.judges.push({
            id: uid("judge"), userId, judgeId, name, email, phone, category, status,
            emailVerified: true, createdAt: now()
        });

        saveDB(db);
        addAuditLog(actor, "Judge registered by admin", `${name} was registered as a judge.`);
        closeModal();
        showToast("Judge registered successfully.");
        renderApp();
    }
}

function toggleJudgeStatus(id) {
    const db = getDB();
    const judge = db.judges.find(j => j.id === id);
    if (!judge) return;

    if (judge.status === "inactive") {
        const activeCount = db.judges.filter(j => j.category === judge.category && j.status === "active").length;
        const max = Number(db.settings.maxJudgesPerCategory || 3);

        if (activeCount >= max) {
            showToast(`Cannot activate. ${judge.category} already has ${max} active judges.`, "danger");
            return;
        }
    }

    judge.status = judge.status === "active" ? "inactive" : "active";

    const user = db.users.find(u => u.id === judge.userId);
    if (user) user.active = judge.status === "active";

    saveDB(db);
    addAuditLog(currentUser(), "Judge status changed", `${judge.name} is now ${judge.status}.`);
    showToast("Judge status updated.");
    renderApp();
}

function deleteJudge(id) {
    const db = getDB();
    const judge = db.judges.find(j => j.id === id);
    if (!judge) return;

    showConfirm("Delete Judge",
        `Delete judge "${judge.name}"? Their assignments, marks and conflicts will also be removed. This cannot be undone.`,
        "Delete Judge",
        () => {
            db.judges = db.judges.filter(j => j.id !== id);
            db.users = db.users.filter(u => u.id !== judge.userId);
            db.assignments = db.assignments.filter(a => a.judgeId !== id);
            db.marks = db.marks.filter(m => m.judgeId !== id);
            db.conflicts = db.conflicts.filter(c => c.judgeId !== id);

            saveDB(db);
            addAuditLog(currentUser(), "Judge deleted", `Judge ${judge.name} was deleted.`);
            showToast("Judge deleted.");
            renderApp();
        });
}

/* approveJudge returns true on success (used by batch approval) */
function approveJudge(requestId, silent = false) {
    const db = getDB();
    const request = db.judgeRequests.find(r => r.id === requestId);
    if (!request) return false;

    const max = Number(db.settings.maxJudgesPerCategory || 3);
    const activeCount = db.judges.filter(j => j.category === request.category && j.status === "active").length;

    if (activeCount >= max) {
        if (!silent) showToast(`Cannot approve. ${request.category} already has ${max} active judges.`, "danger");
        return false;
    }

    const userId = uid("user");

    db.users.push({
        id: userId, username: request.email, password: request.password,
        role: "judge", name: request.name, active: true, createdAt: now()
    });

    db.judges.push({
        id: uid("judge"), userId,
        judgeId: request.judgeId, name: request.name, email: request.email,
        phone: request.phone, category: request.category, status: "active",
        /* Prototype: auto-verified. Replace with backend email verification. */
        emailVerified: true,
        createdAt: now()
    });

    request.status = "approved";
    request.approvedAt = now();

    saveDB(db);

    addAuditLog(currentUser(), "Judge approved",
        `${request.name} was approved for ${request.category}.`);

    if (!silent) {
        showToast("Judge approved. Connect your backend email service for production verification.");
        renderApp();
    }

    return true;
}

function rejectJudge(requestId) {
    const db = getDB();
    const request = db.judgeRequests.find(r => r.id === requestId);
    if (!request) return;

    showConfirm("Reject Registration",
        `Reject the registration request from ${request.name} (${request.category})?`,
        "Reject Request",
        () => {
            request.status = "rejected";
            request.rejectedAt = now();
            saveDB(db);
            addAuditLog(currentUser(), "Judge registration rejected", `${request.name}'s registration was rejected.`);
            showToast("Registration rejected.");
            renderApp();
        });
}

function openAssignmentModal(projectId) {
    const db = getDB();
    const project = db.projects.find(p => p.id === projectId);
    if (!project) return;

    const assignments = db.assignments.filter(a => a.projectId === projectId);
    const assignedIds = assignments.map(a => a.judgeId);

    const eligible = db.judges.filter(j => {
        if (j.status !== "active") return false;
        if (j.category !== project.category) return false;
        if (assignedIds.includes(j.id)) return false;
        return !db.conflicts.some(c => c.projectId === projectId && c.judgeId === j.id && c.status === "active");
    });

    document.getElementById("modalTitle").textContent = "Manage Judge Assignments";

    document.getElementById("modalBody").innerHTML = `

        <div class="mb-3">
            <strong>${escapeHtml(project.projectCode)}</strong>
            <div class="small text-muted">${escapeHtml(project.title)}</div>
            <div class="small mt-1">Category: <strong>${escapeHtml(project.category)}</strong></div>
        </div>

        <div class="alert alert-light border small">
            Only active judges in the same category are eligible.
            Judges with an active conflict are excluded automatically.
            Maximum: ${MAX_PROJECT_JUDGES} judges per project.
        </div>

        <h6 class="fw-bold mt-4">Assigned Judges</h6>

        ${!assignments.length ? `
            <div class="text-muted small py-3">No judges assigned yet.</div>` :
            assignments.map(a => {
                const judge = db.judges.find(j => j.id === a.judgeId);
                return `
                    <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2">
                        <div>
                            <strong class="small">${escapeHtml(judge?.name || "Deleted Judge")}</strong>

                                onclick="unassignJudge('${projectId}','${a.judgeId}')">Unassign</button>
                    </div>`;
            }).join("")}

        <h6 class="fw-bold mt-4">Add Eligible Judge</h6>

        ${assignments.length >= MAX_PROJECT_JUDGES ? `
            <div class="alert alert-success small">This project already has ${MAX_PROJECT_JUDGES} assigned judges.</div>` : `
            <div class="input-group">
                <select id="assignmentJudge" class="form-select">
                    <option value="">Select an eligible judge</option>
                    ${eligible.map(j => `
                        <option value="${j.id}">${escapeHtml(j.name)} — ${escapeHtml(j.judgeId)}</option>`).join("")}
                </select>
                <button class="btn btn-main" onclick="assignJudge('${projectId}')">Assign</button>
